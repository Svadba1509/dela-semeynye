<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дела семейные - Совместные дела</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #fdf2f8, #fce7f3, #f0f4ff); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 400px; width: 100%; padding-top: 40px; }
        h1 { font-size: 24px; color: #1f2937; text-align: center; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #6b7280; text-align: center; margin-bottom: 24px; }
        .section { background: rgba(255,255,255,0.6); backdrop-filter: blur(8px); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .section-title { font-size: 12px; color: #9ca3af; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .example { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.8); transition: all 0.2s; }
        .example.selected { background: rgba(129,140,248,0.1); border-color: #818cf8; }
        .example .circle { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #d1d5db; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
        .example.selected .circle { border-color: #818cf8; background: #818cf8; color: white; }
        .example .text { font-size: 14px; color: #1f2937; flex: 1; }
        .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .input-group input { flex: 1; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #ec4899; }
        .input-group button { padding: 10px 16px; background: #ec4899; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; }
        .custom-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; margin-bottom: 8px; background: rgba(255,255,255,0.4); }
        .custom-item .circle { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ec4899; background: #ec4899; color: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .custom-item .text { font-size: 14px; color: #1f2937; flex: 1; }
        .btn { display: inline-block; width: 100%; padding: 14px 24px; background: rgba(255,255,255,0.3); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.4); border-radius: 12px; font-size: 16px; color: #374151; text-decoration: none; cursor: pointer; text-align: center; margin-top: 16px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>Совместные дела</h1>
        <p class="subtitle">Выберите дела из списка или добавьте свой вариант</p>
        
        <div class="section">
            <div class="section-title">Примеры</div>
            <div class="example" onclick="toggleExample(0)"><div class="circle" id="ex0"></div><span class="text">Играть вместе</span></div>
            <div class="example" onclick="toggleExample(1)"><div class="circle" id="ex1"></div><span class="text">Сказка перед сном</span></div>
        </div>
        
        <div class="section">
            <div class="section-title">Свой вариант</div>
            <div class="input-group">
                <input type="text" id="customInput" placeholder="Введите своё совместное дело..." maxlength="50">
                <button onclick="addCustom()">+</button>
            </div>
            <div id="customList"></div>
        </div>
        
        <a href="https://dela-semeynye.vercel.app/execute" class="btn" id="nextBtn" style="display:none">Далее →</a>
    </div>

    <script>
        const examples = ['Играть вместе', 'Сказка перед сном'];
        let selected = new Set(JSON.parse(localStorage.getItem('parentSelected') || '[]'));
        let custom = JSON.parse(localStorage.getItem('parentCustom') || '[]');
        
        function render() {
            examples.forEach((_, i) => {
                const circle = document.getElementById('ex' + i);
                const parent = circle.parentElement;
                if (selected.has(i)) {
                    circle.textContent = '✓';
                    circle.style.borderColor = '#818cf8';
                    circle.style.background = '#818cf8';
                    circle.style.color = 'white';
                    parent.classList.add('selected');
                } else {
                    circle.textContent = '';
                    circle.style.borderColor = '#d1d5db';
                    circle.style.background = 'transparent';
                    parent.classList.remove('selected');
                }
            });
            
            const list = document.getElementById('customList');
            list.innerHTML = '';
            custom.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'custom-item';
                div.innerHTML = '<div class="circle">✓</div><span class="text">' + item + '</span><button onclick="removeCustom(' + i + ')" style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:18px">✕</button>';
                list.appendChild(div);
            });
            
            const total = selected.size + custom.length;
            document.getElementById('nextBtn').style.display = total > 0 ? 'block' : 'none';
        }
        
        function toggleExample(i) {
            if (selected.has(i)) selected.delete(i);
            else if (selected.size + custom.length < 4) selected.add(i);
            localStorage.setItem('parentSelected', JSON.stringify([...selected]));
            render();
        }
        
        function addCustom() {
            const input = document.getElementById('customInput');
            const val = input.value.trim();
            if (!val || selected.size + custom.length >= 4) return;
            custom.push(val);
            localStorage.setItem('parentCustom', JSON.stringify(custom));
            input.value = '';
            render();
        }
        
        function removeCustom(i) {
            custom.splice(i, 1);
            localStorage.setItem('parentCustom', JSON.stringify(custom));
            render();
        }
        
        render();
    </script>
</body>
</html>
