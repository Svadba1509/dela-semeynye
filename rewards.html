<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дела семейные - Награды</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #fefce8, #ffedd5, #ffe4e6); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 400px; width: 100%; padding-top: 40px; }
        h1 { font-size: 24px; color: #1f2937; text-align: center; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #6b7280; text-align: center; margin-bottom: 24px; }
        .input-group { background: rgba(255,255,255,0.6); backdrop-filter: blur(8px); border-radius: 16px; padding: 16px; margin-bottom: 16px; display: flex; gap: 8px; }
        .input-group input { flex: 1; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #f59e0b; }
        .input-group button { padding: 10px 16px; background: #f59e0b; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; }
        .reward { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.6); backdrop-filter: blur(8px); border-radius: 12px; padding: 14px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.8); }
        .reward .circle { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #f59e0b; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #f59e0b; color: white; }
        .reward .text { flex: 1; font-size: 14px; color: #1f2937; }
        .btn { display: inline-block; width: 100%; padding: 14px 24px; background: rgba(255,255,255,0.3); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.4); border-radius: 12px; font-size: 16px; color: #374151; text-decoration: none; cursor: pointer; text-align: center; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>Награды для ребёнка</h1>
        <p class="subtitle">Добавьте награды,которые ребенок получит после выполнения задач и нажмите +</p>
        <div class="input-group">
            <input type="text" id="rewardInput" placeholder="Введите награду..." maxlength="50">
            <button onclick="addReward()">+</button>
        </div>
        <div id="rewardList"></div>
        <a href="parent.html" class="btn" id="nextBtn" style="display:none">Далее →</a>
    </div>
    <script>
        let rewards = JSON.parse(localStorage.getItem('rewards') || '[]');
        function render() {
            const list = document.getElementById('rewardList');
            list.innerHTML = '';
            rewards.forEach((reward, i) => {
                const div = document.createElement('div');
                div.className = 'reward';
                div.innerHTML = '<div class="circle">✓</div><span class="text">' + reward + '</span><button onclick="removeReward(' + i + ')" style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:18px">✕</button>';
                list.appendChild(div);
            });
            document.getElementById('nextBtn').style.display = rewards.length > 0 ? 'block' : 'none';
        }
        function addReward() {
            const input = document.getElementById('rewardInput');
            const val = input.value.trim();
            if (!val || rewards.length >= 4) return;
            rewards.push(val);
            localStorage.setItem('rewards', JSON.stringify(rewards));
            input.value = '';
            render();
        }
        function removeReward(i) {
            rewards.splice(i, 1);
            localStorage.setItem('rewards', JSON.stringify(rewards));
            render();
        }
        render();
    </script>
</body>
</html>
